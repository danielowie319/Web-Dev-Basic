<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Create a section container -->
    <section>
        <!-- Have a title for the form -->
        <h1>Contact Us</h1>
        <!-- Create a form to contain all form elements -->
        <form action="">
            <!-- Create an input for the name -->            
            <input type="text" placeholder="Name">
            <!-- Create an input for the email -->
            <input type="email" placeholder="Email">
            <!-- Create an input for the phone number -->
            <input type="number" placeholder="Phone Number">
            <!-- Create a textarea to send a message -->
            <textarea name="" id="" placeholder="message">
                
            </textarea>
            <!-- Then finally create a button to submit the form -->
            <button type="submit">Send</button>
        </form>
    </section>
</body>
</html>
